# Working Foundation — one-command stack
# Usage:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (wipes Keycloak + data volumes)

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm, client, roles, accounts: generated by  python directory/build_keycloak_realm.py
      # (imported only when the realm does not exist yet; to re-import: docker compose down -v)
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  # App runs on the host with: dotnet run
  # Data folder is mapped so SQLite files survive restarts.
  # When you containerize the app later, add a service here.

volumes:
  keycloak_data:
