# Working Foundation — one-command stack
# Usage:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (wipes Keycloak + data volumes)

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm, client, roles, accounts: generated by  python directory/build_keycloak_realm.py
      # (imported only when the realm does not exist yet; to re-import: docker compose down -v)
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Isa's spoken voice for the Library's Listen button: Kokoro-82M, on this machine, CPU only.
  # Isa asks it for one sentence at a time (voice bf_lily, set in appsettings.json "Tts") and keeps
  # every sentence it makes in data/tts-cache. It is free and runs offline once the model has downloaded.
  # Before the demo: pin the image to a specific version tag instead of "latest" (viability criterion 5).
  # If it is not running, Listen falls back to the device's own voice; nothing breaks.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped

  # App runs on the host with: dotnet run
  # Data folder is mapped so SQLite files survive restarts.
  # When you containerize the app later, add a service here.

volumes:
  keycloak_data:
